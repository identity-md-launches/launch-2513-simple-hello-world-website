<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello, world! An octopus says hello</title>
    <meta name="description" content="A simple hello world page with a hand-drawn octopus. Say hello and get a greeting back." />
    <meta property="og:title" content="Hello, world! An octopus says hello" />
    <meta property="og:description" content="A simple hello world page with a hand-drawn octopus." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A smiling, eight-armed octopus beneath the words Hello, world!" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./src/layout.css" />
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <main>
      <h1>Hello, world!</h1>
      <img class="octopus" src="./src/octopus.svg" width="320" height="280" alt="A smiling octopus with eight curling arms." />
      <div class="greeting">
        <button id="hello" type="button" hidden>Say hello</button>
        <p id="reply" role="status" aria-atomic="true"></p>
        <noscript>This octopus says hello!</noscript>
      </div>
    </main>
  </body>
</html>
